<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient (Indigo to Sky Blue) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Golden Energy Gradient for Lightning -->
    <linearGradient id="bolt" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for Contrast in Browser Tabs -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.5"/>
    </filter>

    <filter id="bolt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bg)" filter="url(#shadow)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5"/>

  <!-- High-Gloss Border Accent -->
  <rect x="4.5" y="4.5" width="55" height="27" rx="13.5" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>

  <!-- Dynamic Lightning Bolt Symbol ⚡ -->
  <path d="M35.5 8 L18 34 H31 L24 56 L47 28 H34.5 L39.5 8 Z" fill="url(#bolt)" filter="url(#bolt-glow)"/>

  <!-- Subtle Core Shimmer Highlight -->
  <path d="M35.5 8 L24 31 H33 L28 47 L43 28 H34 L37.5 12 Z" fill="#ffffff" opacity="0.35"/>
</svg>
